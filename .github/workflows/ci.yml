name: FeatureManagement-Dotnet CI

on:
  push:
    branches:
      - main
      - preview
      - release/*
  pull_request:
    branches:
      - main
      - preview
      - release/*

permissions:
  security-events: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install .NET
        run: pwsh build/install-dotnet.ps1 -RestoreOnly

      - name: Restore
        run: pwsh build.ps1 -RestoreOnly

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: 'csharp'

      - name: Dotnet Build
        run: pwsh build.ps1

      - name: Dotnet Pack
        run: pwsh pack.ps1

      - name: Dotnet Test
        run: pwsh test.ps1

      - name: Publish Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unit Test Results
          path: ${{ github.workspace }}/tests/**/*.trx

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
